name: plop
description: A shared shelf for files, screenshots and text on your Wi-Fi.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  bonsoir: ^7.1.5
  desktop_drop: ^0.8.4
  device_info_plus: ^13.3.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  hotkey_manager: ^0.2.3
  pasteboard: ^0.5.0
  path_provider: ^2.1.6
  plop_core:
    path: ../packages/core
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  # The Windows probe must test the exact key code hotkey_manager registers,
  # so this tracks hotkey_manager's own resolution; drop it if that does.
  uni_platform: 0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/icon/icon.png
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: assets/icon/foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/icon_macos.png
  windows:
    generate: true
    image_path: assets/icon/icon_macos.png
    icon_size: 256
