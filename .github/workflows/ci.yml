# macOS, iOS and Android are built and tested on the dev Mac. CI covers the
# core tests and the desktop targets that machine cannot build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - working-directory: packages/core
        run: |
          dart pub get
          dart analyze
          dart test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libkeybinder-3.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter build linux --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: plop-windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 7
