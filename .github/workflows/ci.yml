# macOS, iOS and Android are built and tested on the dev Mac. CI covers the
# core tests, the app's widget tests and the desktop targets that machine
# cannot build. The Windows build (billed at 2x) waits for the cheap core
# tests and the Linux analyze/test/build, so a red commit never pays for it,
# and runs only when something it compiles changed (see the core job) or
# when run by hand (Actions > CI > Run workflow). Installable builds come
# from release.yml.
name: CI

# Skip pushes that only touch files no job here builds or tests (minutes are
# billed on a private repo; Windows counts double). site/ is the static
# download page, which nothing here builds.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
      - 'LICENSE'
      - 'packaging/**'
      - '.github/workflows/release.yml'
      - 'app/android/**'
      - 'app/ios/**'
      - 'app/macos/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
      - 'LICENSE'
      - 'packaging/**'
      - '.github/workflows/release.yml'
      - 'app/android/**'
      - 'app/ios/**'
      - 'app/macos/**'
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run it supersedes, so the
# latest commit on main is always the one tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: read lets paths-filter list a PR's files.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.paths.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
      # What the Windows build compiles: the Dart (the app's and the core
      # package's), its runner, the plugin set and this file's Flutter pin.
      # A push of only Linux runner files, tests or assets cannot break it
      # once Linux is green. Here rather than in a job of its own, which
      # would cost a billed minute per run. On a push to main the files are
      # those of the commits pushed; on a PR, the PR's.
      - uses: dorny/paths-filter@v4
        id: paths
        with:
          filters: |
            windows:
              - 'app/lib/**'
              - 'app/windows/**'
              - 'app/pubspec.yaml'
              - 'app/pubspec.lock'
              - 'packages/core/lib/**'
              - 'packages/core/pubspec.yaml'
              - '.github/workflows/ci.yml'
      - uses: dart-lang/setup-dart@v1
      - working-directory: packages/core
        run: |
          dart pub get
          dart analyze
          dart test

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libkeybinder-3.0-dev libnotify-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build linux --release
          # What the tray plugin links, which release.yml ships in the tarball.
          ldd build/linux/x64/release/bundle/lib/libtray_manager_plugin.so
      # The layout test's screenshots, so an overflow on a red run can be
      # looked at from the PR.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plop-layout-screens
          path: app/build/screens/
          if-no-files-found: ignore
          retention-days: 3

  windows:
    needs: [core, linux]
    if: github.event_name == 'workflow_dispatch' || needs.core.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      # The VC++ runtime, so this test build starts on PCs without the
      # Visual C++ Redistributable. For a test build of a commit that skipped
      # this job, run CI by hand on its branch.
      - working-directory: app
        run: Copy-Item "$env:WINDIR\System32\msvcp140.dll", "$env:WINDIR\System32\vcruntime140.dll", "$env:WINDIR\System32\vcruntime140_1.dll" build\windows\x64\runner\Release
      - uses: actions/upload-artifact@v7
        with:
          name: plop-windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 3
