# Installable builds, attached to a GitHub Release:
#   macOS    plop-macos.dmg, plop-macos.zip (universal, ad-hoc signed)
#   Windows  plop-windows-setup.exe, plop-windows-x64.zip (VC++ runtime included)
#   Linux    plop-linux-x64.tar.gz (libkeybinder, libnotify, libayatana-appindicator and a
#            launcher icon included)
#   Android  plop-android.apk (debug-signed, for sideloading)
# Push a tag for a release: git tag v0.2.0 && git push origin v0.2.0.
# Running it by hand from a branch replaces the "dev" prerelease instead.
# iPhone builds can't be distributed without a paid Apple account; see README.
# Never runs on a plain push: macOS minutes are billed at 10x on private repos.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Every dev run rewrites the same "dev" release, so they take turns; tag runs
# only queue behind a rerun of the same tag.
concurrency:
  group: ${{ github.ref_type == 'tag' && format('release-{0}', github.ref) || 'release-dev' }}

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos, os: macos-latest }
          - { target: windows, os: windows-latest }
          # Pinned: the build host's glibc is the oldest one plop runs on.
          - { target: linux, os: ubuntu-24.04 }
          - { target: android, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libkeybinder-3.0-dev libnotify-dev libayatana-appindicator3-dev patchelf
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Optional secret ANDROID_DEBUG_KEYSTORE, the base64 of your
      # ~/.android/debug.keystore: every APK then has the same signature and
      # installs over the previous one. Without it each run gets a new key.
      - if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          fi

      # Tag v1.2.3 builds version 1.2.3, anything else pubspec's version. The
      # run number keeps Android's versionCode rising from build to build.
      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}
          else version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml); fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          flutter build ${{ matrix.target == 'android' && 'apk' || matrix.target }} --release \
            --build-name="$version" --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p ../dist

      - if: matrix.target == 'macos'
        run: |
          app=build/macos/Build/Products/Release/plop.app
          lipo "$app/Contents/MacOS/plop" -verify_arch arm64 x86_64
          # Ad-hoc signed (no Apple account), so not notarized: see README for
          # the first open. The app is signed again on its own to keep its
          # sandbox and network entitlements.
          codesign --force --deep --sign - "$app"
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict "$app"
          # ditto, not zip, keeps the frameworks' symlinks intact.
          ditto -c -k --keepParent "$app" ../dist/plop-macos.zip
          mkdir dmg && ditto "$app" dmg/plop.app && ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on hosted runners.
          for i in 1 2 3; do
            hdiutil create -volname plop -srcfolder dmg -format UDZO -ov ../dist/plop-macos.dmg && break
            [ "$i" -lt 3 ] && sleep 10 || exit 1
          done

      # Inno Setup 6 is preinstalled on windows-latest (runner-images readme).
      - if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $out = 'build\windows\x64\runner\Release'
          # The VC++ runtime, so plop.exe starts on PCs without the Visual C++
          # Redistributable. Copies next to the exe take precedence.
          Copy-Item "$env:WINDIR\System32\msvcp140.dll", "$env:WINDIR\System32\vcruntime140.dll", "$env:WINDIR\System32\vcruntime140_1.dll" $out
          Compress-Archive "$out\*" ..\dist\plop-windows-x64.zip
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" ..\packaging\windows\plop.iss

      # libkeybinder-3.0 (shortcuts), libnotify (notifications) and
      # libayatana-appindicator3 (the tray icon) are not default packages on
      # every desktop; ship them so the tarball starts without an apt
      # install, like the VC++ runtime on Windows. Each plugin .so needs its
      # own $ORIGIN rpath: plop's RUNPATH does not apply to a plugin's
      # dependencies. The appindicator brings four more a stock GTK desktop
      # may lack (its indicator and ido widgets, and the two dbusmenu
      # libraries that hand its menu to the panel); they ship too, each with
      # an $ORIGIN rpath so they find one another in bundle/lib. The checks
      # make a plugin bump that drops or renames a library fail the build
      # rather than ship a tarball that dies on launch. plop.png is the
      # launcher icon the app registers on first run (lib/login_item.dart).
      - if: matrix.target == 'linux'
        run: |
          bundle=build/linux/x64/release/bundle
          ship() {  # ship <plugin .so> <library> next to the plugin
            lib=$(ldd "$1" | awk -v so="$2" 'index($1, so) == 1 {print $3}')
            test -f "$lib"
            cp "$lib" "$bundle/lib/"
            patchelf --set-rpath '$ORIGIN' "$1"
            ldd "$1" | grep -q "$PWD/$bundle/lib/$2" || { echo "$2 not resolved from bundle/lib"; exit 1; }
          }
          ship "$bundle/lib/libhotkey_manager_linux_plugin.so" libkeybinder-3.0.so
          ship "$bundle/lib/liblocal_notifier_plugin.so" libnotify.so
          tray="$bundle/lib/libtray_manager_plugin.so"
          ldd "$tray"
          ship "$tray" libayatana-appindicator3.so
          for so in libayatana-indicator3.so libayatana-ido3- libdbusmenu-glib.so libdbusmenu-gtk3.so; do
            lib=$(ldd "$tray" | awk -v so="$so" 'index($1, so) == 1 {print $3}')
            test -f "$lib" || { echo "$so is no longer linked: check what the tray plugin needs"; exit 1; }
            cp "$lib" "$bundle/lib/"
          done
          for lib in "$bundle"/lib/lib{ayatana,dbusmenu}*; do
            patchelf --set-rpath '$ORIGIN' "$lib"
          done
          deps=$(ldd "$tray")
          for so in libayatana-appindicator3.so libayatana-indicator3.so libayatana-ido3- libdbusmenu-glib.so libdbusmenu-gtk3.so; do
            grep -q "$PWD/$bundle/lib/$so" <<< "$deps" || { echo "$so not resolved from bundle/lib"; exit 1; }
          done
          cp assets/icon/icon_macos.png "$bundle/plop.png"
          tar -czf ../dist/plop-linux-x64.tar.gz -C build/linux/x64/release --transform 's,^bundle,plop,' bundle

      - if: matrix.target == 'android'
        run: cp build/app/outputs/flutter-apk/app-release.apk ../dist/plop-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: plop-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          # Only a hand-off to the release job; the release assets are the
          # lasting copy and don't count against Actions storage.
          retention-days: 2

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          ls -l dist
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" dist/* --clobber
            else
              gh release create "$tag" dist/* --verify-tag --generate-notes --title "plop ${tag#v}"
            fi
          else
            gh release delete dev --cleanup-tag --yes || true
            gh release create dev dist/* --prerelease --target "$GITHUB_SHA" --title "dev build" \
              --notes "Test build of $GITHUB_REF_NAME at ${GITHUB_SHA::7}. Not a release."
          fi
